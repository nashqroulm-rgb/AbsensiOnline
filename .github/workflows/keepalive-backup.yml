name: Supabase Keepalive & Backup

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install Supabase CLI
      run: |
        curl -fsSL https://github.com/supabase/cli/releases/latest/download/supabase_linux_amd64.tar.gz -o /tmp/supabase.tar.gz
        tar -xzf /tmp/supabase.tar.gz -C /tmp
        sudo mv /tmp/supabase /usr/local/bin/
        supabase --version

    - name: Keepalive ping
      env:
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        curl -s -o /dev/null -w "HTTP %{http_code}\n" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          "https://iufmhtojfqrcmbdtazfq.supabase.co/rest/v1/users?limit=1"

    - name: Dump database using Supabase CLI
      env:
        SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        SUPABASE_PROJECT_REF: iufmhtojfqrcmbdtazfq
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      run: |
        mkdir -p backups
        supabase db dump --project-ref "$SUPABASE_PROJECT_REF" --service-role-key "$SUPABASE_SERVICE_ROLE_KEY" --include-schemas public --format custom --file backups/backup_$(date +%Y%m%d_%H%M%S).sql
        # Or use pg_dump if CLI not available
        # For now, we fallback to pg_dump if CLI fails, but we skip IPv4 resolution

    - name: Create backup directory
      run: mkdir -p backups

    - name: Dump database
      env:
        DATABASE_URL: ${{ secrets.SUPABASE_DIRECT_URL }}
        PGHOSTADDR: ${{ env.DB_IPV4 }}
        PGSSLMODE: require
      run: |
        pg_dump "$DATABASE_URL" --format=custom --file=backups/backup_$(date +%Y%m%d_%H%M%S).dump

    - name: Compress backup
      run: gzip backups/*.dump

    - name: Remove old backups (keep last 30)
      run: |
        cd backups
        ls -t *.dump.gz | tail -n +31 | xargs -r rm

    - name: Commit and push
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add backups/
        git commit -m "Backup: $(date -u +%Y-%m-%dT%H:%M:%SZ)" || echo "No changes"
        git push