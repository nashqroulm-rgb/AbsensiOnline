name: Supabase Keepalive

# FIXPLAN S6: dump database TIDAK BOLEH masuk repo (PII).
# Yang dipertahankan hanya ping harian agar project Supabase
# gratis tidak di-pause. Backup DB kelola di luar git.

on:
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

jobs:
  maintain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Keepalive ping
      env:
        SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      run: |
        curl -s -o /dev/null -w "HTTP %{http_code}\n" \
          -H "apikey: $SUPABASE_ANON_KEY" \
          "https://iufmhtojfqrcmbdtazfq.supabase.co/rest/v1/zones?limit=1"
